<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一集一练 · Series English Agent</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body>
<aside><a class="brand" href="./">▤ 一集一练 <i></i></a><p class="muted caps">SERIES ENGLISH AGENT</p><label for="course">我的课程</label><select id="course" aria-label="选择课程"></select><div class="collection"><span>PLAY<br>LEARN<br>REPEAT.</span><p>把听过的表达，<br>变成自己的英语。</p></div><div class="index-title">本集词汇 <span id="count"></span></div><nav id="words" aria-label="词汇目录"></nav><div class="side-foot">每天一小段，慢慢听懂。</div></aside>
<main><header><span>我的学习 / <b id="series">课程库</b></span><span id="save-status" role="status">学习记录保存在此浏览器</span></header>
<section class="workspace"><div class="heading"><div><p id="eyebrow" class="caps"></p><h1 id="title">正在读取课程…</h1><p id="summary" class="muted"></p></div><span class="edition">LEARN<br>AT YOUR PACE</span></div>
<div id="error" role="alert" hidden></div><div class="toolbar"><button id="hide" aria-pressed="false">◉ 隐藏中文</button><div><label class="sr-only" for="voice">发音声音</label><select id="voice" aria-label="发音声音"></select><select id="rate" aria-label="播放速度"><option value="0.75">0.75× 语速</option><option value="1" selected>1× 语速</option><option value="1.25">1.25× 语速</option></select><button id="auto">♫ 连续跟读</button></div></div>
<article id="card"><div class="card-top"><span id="position" class="caps"></span><span id="repeat" class="tag"></span></div><div class="term-row"><h2 id="term"></h2><button id="speak-term" class="sound" aria-label="播放词组发音">▷</button></div><p id="ipa" class="muted"></p><p id="meaning" class="meaning"></p><div class="example"><p class="example-label">放进一句话里 <span>原创练习句</span></p><div class="sentence-row"><p id="sentence"></p><button id="speak-sentence" aria-label="播放例句发音">▷</button></div><p id="translation" class="muted"></p></div><div class="tip"><span>用法笔记</span><p id="tip"></p></div><div class="card-bottom"><span>♫ 浏览器合成语音</span><span id="play-status" role="status"></span></div></article>
<div class="actions"><button id="prev">← 上一个</button><div><button id="review" aria-pressed="false">↺ 待复习</button><button id="known" aria-pressed="false">✓ 已掌握</button></div><button id="next" class="primary">下一个 →</button></div>
<section class="review-panel"><div><h3>把学过的，再记牢一点</h3><p id="due" class="muted"></p></div><button id="due-next">开始复习 →</button></section>
<footer><p id="source"></p><p>声音由设备提供；缺少英语语音时，请在系统设置中安装。此版本不录音、不评分。</p><div class="backup"><button id="export">导出学习进度</button><label class="file-button">恢复学习进度<input type="file" id="import" accept=".json,application/json"></label></div><p>导出的进度文件可交给学习 Agent，生成针对你的复习练习。清除浏览器数据会丢失未备份的记录。</p></footer>
</section></main></body></html>
